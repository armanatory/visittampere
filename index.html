<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sushi Discovery - Visit Tampere</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Sushi Discovery Map</h1>
            <p class="subtitle">Explore sushi restaurants and attractions in Tampere</p>
        </header>

        <div class="main-layout">
            <aside class="sidebar">
                <div class="sidebar-header">
                    <h2 id="sidebar-title">Restaurants & Attractions</h2>
                    <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle sidebar">×</button>
                </div>

                <div class="search-filters">
                    <input
                        type="text"
                        id="search-input"
                        placeholder="Search by name..."
                        class="search-box"
                    >

                    <div class="filter-buttons">
                        <button class="filter-btn active" data-filter="all">All</button>
                        <button class="filter-btn" data-filter="restaurants">Restaurants</button>
                        <button class="filter-btn" data-filter="attractions">Attractions</button>
                    </div>
                </div>

                <div class="poi-list" id="poi-list">
                    <!-- Dynamically populated -->
                </div>
            </aside>

            <main class="map-container">
                <div id="map"></div>

                <div class="map-controls">
                    <div class="layer-toggle">
                        <label>
                            <input type="checkbox" id="layer-restaurants" checked>
                            <span>Sushi Restaurants</span>
                        </label>
                        <label>
                            <input type="checkbox" id="layer-attractions" checked>
                            <span>Attractions</span>
                        </label>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <div class="popup-overlay" id="popup-overlay">
        <div class="popup-content" id="popup-content">
            <!-- Dynamically populated -->
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
